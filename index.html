        <!-- Titre, description, URL canonique, aperçus de partage et fiche Personne :

        <!-- Canonical URL -->

        <meta name="format-detection" content="address=no"/>
        <meta name="color-scheme" content="dark light">

        <!-- Meta: SEO -->
        <meta name="description" content="Portfolio de Sayouba Ouedraogo — Développeur Full Stack (web, mobile, IA). Projets, expériences et contact."/>

        <!-- Structured Data -->
        <script type="application/ld+json">

            "@type": "Person",

            "description": "Développeur Full Stack — web, mobile et IA.",

                "https://github.com/sayouba2",

            ]
        }
        </script>

        <!-- SPA fallback: restore the path stashed by 404.html on GitHub Pages -->
        <script>
        (function(l) {
            if (l.search[1] === '/') {
                var decoded = l.search.slice(1).split('&').map(function(s) {
                    return s.replace(/~and~/g, '&')
                }).join('?');
                window.history.replaceState(null, null, l.pathname.slice(0, -1) + decoded + l.hash);
            }
        }(window.location))
        </script>

        <link rel="preload" href="/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin>
        <link rel="preload" href="/fonts/playfair-italic-latin.woff2" as="font" type="font/woff2" crossorigin>
        <script>
            try {
                var savedTheme = localStorage.getItem('portfolio-theme');
                document.documentElement.dataset.theme = savedTheme === 'light' ? 'light' : 'dark';
            } catch (_) { document.documentElement.dataset.theme = 'dark'; }
        </script>
    </head>
